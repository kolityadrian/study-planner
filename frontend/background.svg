<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>

    <symbol id="book" viewBox="0 0 100 100">
      <path d="M50 22 C38 14 22 14 8 20 V78 C22 72 38 72 50 80 Z" />
      <path d="M50 22 C62 14 78 14 92 20 V78 C78 72 62 72 50 80 Z" />
    </symbol>

    <symbol id="pencil" viewBox="0 0 100 100">
      <path d="M18 82 L24 60 L66 18 L82 34 L40 76 Z"/>
      <path d="M18 82 L24 60 L40 76 Z" opacity="0.6"/>
    </symbol>

    <symbol id="bulb" viewBox="0 0 100 100">
      <path d="M50 10 C28 10 16 28 20 46 C23 58 32 62 34 72 H66 C68 62 77 58 80 46 C84 28 72 10 50 10 Z"/>
      <rect x="36" y="78" width="28" height="7" rx="3"/>
      <rect x="40" y="88" width="20" height="6" rx="3"/>
    </symbol>

    <symbol id="clock" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="8"/>
      <path d="M50 28 V52 L66 62" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="calendar" viewBox="0 0 100 100">
      <rect x="12" y="20" width="76" height="68" rx="10" fill="none" stroke="currentColor" stroke-width="8"/>
      <rect x="12" y="20" width="76" height="22" rx="10"/>
      <rect x="28" y="8" width="8" height="20" rx="4"/>
      <rect x="64" y="8" width="8" height="20" rx="4"/>
      <circle cx="34" cy="62" r="5"/><circle cx="50" cy="62" r="5"/><circle cx="66" cy="62" r="5"/>
    </symbol>

    <symbol id="check" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="8"/>
      <path d="M32 52 L45 65 L70 36" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="cap" viewBox="0 0 100 100">
      <path d="M50 18 L94 40 L50 62 L6 40 Z"/>
      <path d="M26 54 V72 C38 84 62 84 74 72 V54 L50 66 Z" opacity="0.7"/>
      <rect x="88" y="42" width="5" height="24" rx="2"/>
    </symbol>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- dekoratív körök -->
  <circle cx="1080" cy="120" r="180" fill="#c7d2fe" opacity="0.35"/>
  <circle cx="100" cy="700" r="220" fill="#ddd6fe" opacity="0.35"/>

  <g fill="#4f46e5" color="#4f46e5" opacity="0.10">
    <use href="#book"     x="60"   y="70"  width="110" height="110" transform="rotate(-12 115 125)"/>
    <use href="#bulb"     x="300"  y="40"  width="90"  height="90"  transform="rotate(8 345 85)"/>
    <use href="#calendar" x="560"  y="90"  width="100" height="100" transform="rotate(-6 610 140)"/>
    <use href="#cap"      x="840"  y="50"  width="120" height="120" transform="rotate(10 900 110)"/>
    <use href="#pencil"   x="1030" y="260" width="110" height="110" transform="rotate(14 1085 315)"/>

    <use href="#clock"    x="120"  y="330" width="100" height="100" transform="rotate(6 170 380)"/>
    <use href="#check"    x="400"  y="300" width="90"  height="90"  transform="rotate(-10 445 345)"/>
    <use href="#book"     x="700"  y="330" width="95"  height="95"  transform="rotate(10 747 377)"/>
    <use href="#bulb"     x="920"  y="420" width="100" height="100" transform="rotate(-8 970 470)"/>

    <use href="#pencil"   x="60"   y="560" width="100" height="100" transform="rotate(-16 110 610)"/>
    <use href="#cap"      x="300"  y="590" width="110" height="110" transform="rotate(6 355 645)"/>
    <use href="#calendar" x="560"  y="600" width="95"  height="95"  transform="rotate(12 607 647)"/>
    <use href="#clock"    x="800"  y="620" width="100" height="100" transform="rotate(-6 850 670)"/>
    <use href="#check"    x="1040" y="610" width="95"  height="95"  transform="rotate(8 1087 657)"/>
  </g>
</svg>