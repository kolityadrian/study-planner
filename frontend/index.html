<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="t-title"></h1>
    <div class="lang">
      <button data-lang="sr" class="lang-btn">SR</button>
      <button data-lang="hu" class="lang-btn">HU</button>
      <button data-lang="en" class="lang-btn">EN</button>
    </div>
  </header>

  <main>
    <section class="card">
      <form id="plan-form">
        <label><span id="t-subject"></span>
          <input type="text" id="subject" required>
        </label>
        <label><span id="t-date"></span>
          <input type="date" id="exam_date" required>
        </label>
        <label><span id="t-hours"></span>
          <input type="number" id="hours" min="1" max="80" step="0.5" required>
        </label>
        <button type="submit" id="t-submit" class="primary"></button>
        <p id="error" class="error"></p>
      </form>
    </section>

    <div class="tabs">
      <button class="tab active" id="tab-active" data-tab="active"></button>
      <button class="tab" id="tab-finished" data-tab="finished"></button>
    </div>
    <p id="empty" class="muted"></p>

    <div id="plans"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
